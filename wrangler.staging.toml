name = "telegram-multimedia-survey-bot-staging"
main = "src/index.ts"
assets = { directory = "admin/dist", binding = "ASSETS", not_found_handling = "single-page-application", html_handling = "none" }
compatibility_date = "2026-08-14"
workers_dev = true
preview_urls = true

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = false

[vars]
ENVIRONMENT = "staging"
APP_VERSION = "0.3.0-staging"
LICENSE_ENFORCEMENT = "disabled"
LICENSE_GRACE_SECONDS = "86400"
REPORT_CHANNEL_ID = ""
SUBMISSION_BOT_URL = "https://t.me/tougaojiqirbot"

[[d1_databases]]
binding = "DB"
database_name = "telegram-survey-staging-db"
database_id = "cca68a1e-f2af-4c49-9ad1-c752e73f2076"
migrations_dir = "db/migrations"

[[kv_namespaces]]
binding = "MEDIA_KV"
id = "5b8095aaae9f4357a931f416b9ed4d39"
preview_id = "5b8095aaae9f4357a931f416b9ed4d39"

[[kv_namespaces]]
binding = "CACHE"
id = "d1b32d19b1ea4c94b17ee2ce4c4c6b4c"
preview_id = "d1b32d19b1ea4c94b17ee2ce4c4c6b4c"

[[queues.producers]]
binding = "EXPORT_QUEUE"
queue = "telegram-survey-staging-export"

[[queues.consumers]]
queue = "telegram-survey-staging-export"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 3

[browser]
binding = "BROWSER"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SurveySessionDO"

[[durable_objects.bindings]]
name = "BUILDER"
class_name = "SurveyBuilderDO"

[[durable_objects.bindings]]
name = "UI"
class_name = "UiSessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SurveySessionDO", "SurveyBuilderDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UiSessionDO"]

[triggers]
crons = ["*/30 * * * *", "15 1 * * *", "30 9 * * 1"]
