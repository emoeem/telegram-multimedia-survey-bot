name = "telegram-multimedia-survey-bot-staging"
main = "src/index.ts"
assets = { directory = "admin/dist", binding = "ASSETS", not_found_handling = "single-page-application" }
compatibility_date = "2026-08-14"
workers_dev = true
preview_urls = true

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = false

[vars]
ENVIRONMENT = "development"
APP_VERSION = "0.3.0-staging"
LICENSE_ENFORCEMENT = "disabled"
LICENSE_GRACE_SECONDS = "86400"

[[d1_databases]]
binding = "DB"
database_name = "telegram-survey-staging-db"
database_id = "9a8fc70e-5e5d-4c11-b275-d8c552d551c5"
migrations_dir = "db/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "8d51dfe059de4ca8acf49ab029206cea"

[[queues.producers]]
binding = "EXPORT_QUEUE"
queue = "telegram-survey-staging-export"

[[queues.consumers]]
queue = "telegram-survey-staging-export"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 3

[browser]
binding = "BROWSER"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SurveySessionDO"

[[durable_objects.bindings]]
name = "BUILDER"
class_name = "SurveyBuilderDO"

[[durable_objects.bindings]]
name = "UI"
class_name = "UiSessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SurveySessionDO", "SurveyBuilderDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UiSessionDO"]
