[project]
name = "tg-archive"
version = "0.1.0"
description = "Mirror Telegram chats you can read into your own private channel (MVP)."
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36",
    "qrcode>=8.0",
    "pillow>=11.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Everything needed by `pip install -e ".[dev]"` + `pytest`: the async tests
# need pytest-asyncio and TestClient needs httpx, so they must live here and
# not only in the uv-only [dependency-groups] table.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]

[project.scripts]
tg-archive = "tg_archive.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
