<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>问卷管理后台</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg: #f4f6fa;
        --panel: #ffffff;
        --border: #e5e7eb;
        --border-soft: #eef0f4;
        --text: #172033;
        --muted: #6b7280;
        --sidebar-bg: #111827;
        --sidebar-hover: #263449;
        --sidebar-text: #d1d5db;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); }
      button { cursor: pointer; font: inherit; }
      input, select { font: inherit; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px 12px; background: white; }

      .shell { display: flex; min-height: 100vh; }

      /* Sidebar */
      .sidebar { width: 240px; flex-shrink: 0; background: var(--sidebar-bg); color: var(--sidebar-text); padding: 24px 16px; }
      .brand { color: white; font-weight: 700; font-size: 18px; margin-bottom: 32px; white-space: nowrap; }
      nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; color: inherit; padding: 12px; border-radius: 8px; margin: 4px 0; font-size: 14px; }
      nav button.active, nav button:hover { background: var(--sidebar-hover); color: white; }
      .nav-icon { flex-shrink: 0; }
      .backdrop { display: none; }

      /* Main */
      main { flex: 1; min-width: 0; padding: 32px; max-width: 1320px; margin-inline: auto; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 28px; }
      h1 { margin: 0; font-size: 28px; }
      h2 { margin: 0 0 12px; font-size: 18px; }
      .muted { color: var(--muted); }
      .menu { display: none; }

      /* Cards & panels */
      .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
      .card, .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03); }
      .metric { font-size: 30px; font-weight: 700; margin-top: 8px; }
      .panel { margin-top: 24px; }

      /* Table */
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 14px 8px; border-bottom: 1px solid var(--border-soft); font-size: 14px; white-space: nowrap; }
      th { color: var(--muted); font-weight: 600; }
      tbody tr:hover { background: #f8fafc; cursor: pointer; }

      /* Badges */
      .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
      .badge-draft { background: #e5e7eb; color: #374151; }
      .badge-published { background: #dcfce7; color: #166534; }
      .badge-closed { background: #ffedd5; color: #9a3412; }
      .badge-archived { background: #fee2e2; color: #991b1b; }
      .badge-unknown { background: #e5e7eb; color: #374151; }

      /* Toolbar */
      .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
      .toolbar input[type="text"] { flex: 1; min-width: 180px; }

      /* Empty / error states */
      .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
      .state-actions { margin-top: 16px; }
      .btn { border: 1px solid var(--border); background: white; border-radius: 8px; padding: 10px 16px; }
      .btn:hover { background: #f8fafc; }

      /* Skeleton loading */
      .skeleton { border-radius: 8px; background: linear-gradient(90deg, #eceff3 25%, #f6f8fb 50%, #eceff3 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
      .skeleton-line { height: 14px; margin: 12px 0; }
      .skeleton-title { height: 22px; width: 40%; margin: 4px 0 16px; }
      @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

      /* Mobile survey cards */
      .survey-cards { display: none; }
      .survey-card { padding: 16px; border: 1px solid var(--border); border-radius: 10px; background: white; }
      .survey-card:active { background: #f8fafc; }

      /* Staging test banner */
      .test-banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: #fef3c7; border-bottom: 1px solid #f59e0b; font-size: 13px; }
      .test-banner input { width: 180px; padding: 8px 10px; }
      .test-banner .tag { background: #f59e0b; color: white; border-radius: 4px; padding: 2px 8px; font-weight: 600; }

      /* Tablet: sidebar collapses to icon rail */
      @media (max-width: 1000px) {
        .sidebar { width: 76px; padding: 24px 8px; }
        .brand { font-size: 0; }
        .brand::after { content: "📋"; font-size: 22px; }
        nav button { justify-content: center; padding: 12px 4px; }
        .nav-label { display: none; }
        .cards { grid-template-columns: repeat(2, 1fr); }
      }

      /* Mobile: drawer sidebar + card list */
      @media (max-width: 640px) {
        .sidebar { position: fixed; z-index: 30; inset: 0 auto 0 0; width: 240px; padding: 24px 16px; transform: translateX(-100%); transition: transform 0.2s ease; }
        .sidebar.open { transform: none; }
        .brand { font-size: 18px; }
        .nav-label { display: inline; }
        .backdrop { display: block; position: fixed; inset: 0; z-index: 20; background: rgba(15, 23, 42, 0.45); }
        .menu { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 8px; background: white; font-size: 20px; }
        main { padding: 16px; width: 100%; }
        h1 { font-size: 22px; }
        .cards { grid-template-columns: 1fr; gap: 12px; }
        .card, .panel { padding: 16px; }
        table { display: none; }
        .survey-cards { display: grid; gap: 12px; }
        .toolbar input[type="text"] { min-width: 0; width: 100%; }
        .toolbar select { flex: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/app.js"></script>
  </body>
</html>
