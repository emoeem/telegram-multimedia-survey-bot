<!doctype html>
<html lang="zh-CN" class="survey-app">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0e17" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fa" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="data:," />
    <title>问卷</title>
    <script>
      (function () {
        var known = ["foxgold", "dark", "light"];
        var legacy = {
          system: "foxgold",
          night: "dark",
          luxury: "foxgold",
          synthwave: "dark",
          black: "foxgold",
          retro: "light",
          cupcake: "light",
        };
        var preset = "foxgold";
        try {
          var stored = localStorage.getItem("surveyPreset");
          if (stored) preset = legacy[stored] || (known.indexOf(stored) !== -1 ? stored : preset);
        } catch (error) {}
        document.documentElement.setAttribute("data-theme", preset);
      })();
    </script>
    <!--
      启动骨架：#root 里的纯 CSS 首帧。慢网络下 HTML 到 SPA chunk 下载执行之间
      原来是一张纯白页，用户只觉得「打不开」。React createRoot 首次 render 会清空
      容器，骨架自动让位，不需要任何 JS 配合（也正因此不能依赖构建后的 CSS）。
    -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family:
          system-ui,
          -apple-system,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }
      .boot-mark {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 21px;
        color: #17141f;
        /* 默认暗金：foxsir 同款金色渐变 #f5d6a8 → #d4a574 → #b8865a。 */
        background: linear-gradient(135deg, #f5d6a8 0%, #d4a574 60%, #b8865a 100%);
        box-shadow: 0 10px 24px -10px rgba(212, 165, 116, 0.55);
      }
      [data-theme="light"] .boot-mark,
      [data-theme="dark"] .boot-mark {
        color: #fff;
        background: linear-gradient(135deg, #4f46e5, #7c74f2);
        box-shadow: 0 10px 24px -10px rgba(79, 70, 229, 0.55);
      }
      .boot-name {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.35em;
        text-indent: 0.35em;
        color: #9a917f;
      }
      .boot-track {
        width: 128px;
        height: 3px;
        border-radius: 99px;
        overflow: hidden;
        background: rgba(212, 165, 116, 0.16);
      }
      .boot-track i {
        display: block;
        height: 100%;
        width: 42%;
        border-radius: 99px;
        background: #d4a574;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      /* 明/暗两套历史主题下，boot 跟随各自的品牌色。 */
      [data-theme="light"] .boot-name {
        color: #8a93a6;
      }
      [data-theme="dark"] .boot-name {
        color: #78808f;
      }
      [data-theme="light"] .boot-track,
      [data-theme="dark"] .boot-track {
        background: rgba(127, 127, 127, 0.16);
      }
      [data-theme="light"] .boot-track i,
      [data-theme="dark"] .boot-track i {
        background: #4f46e5;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-track i {
          animation: none;
          transform: translateX(130%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <div class="boot-mark">✦</div>
        <p class="boot-name">问卷平台</p>
        <div class="boot-track"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/survey/main.tsx"></script>
  </body>
</html>
