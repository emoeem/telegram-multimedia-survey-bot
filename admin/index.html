<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0e17" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fa" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="data:," />
    <title>问卷管理后台</title>
    <script>
      /* Apply the stored theme before first paint so the default 暗金 (foxgold)
       * palette (or a stored choice) never flashes the wrong background;
       * theme.ts re-applies the same resolution on boot. */
      (function () {
        var known = ["foxgold", "dark", "light"];
        var legacy = {
          system: "foxgold",
          night: "dark",
          luxury: "foxgold",
          synthwave: "dark",
          black: "foxgold",
          retro: "light",
          cupcake: "light",
        };
        var theme = "foxgold";
        try {
          var stored = localStorage.getItem("admin_theme");
          if (stored) theme = legacy[stored] || (known.indexOf(stored) !== -1 ? stored : theme);
        } catch (error) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
