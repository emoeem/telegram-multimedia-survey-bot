<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080d18" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="data:," />
    <title>问卷管理后台</title>
    <script>
      /* Apply the stored theme before first paint so dark-OS users don't get
       * a light flash; theme.ts re-applies the same resolution on boot. */
      (function () {
        var known = ["light", "dark", "night", "luxury", "retro", "cupcake", "synthwave", "black"];
        var theme = "light";
        try {
          var stored = localStorage.getItem("admin_theme");
          if (stored && known.indexOf(stored) !== -1) theme = stored;
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (error) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
