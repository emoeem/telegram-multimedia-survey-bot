name: Visual baseline

# 截图基线只能在这个环境里生成。
#
# Playwright 的 toHaveScreenshot 对字体渲染极其敏感：同一份 HTML 在
# ubuntu-latest + fonts-noto-cjk 和开发机上是像素级不同的。在本地跑
# --update-snapshots 会把本地字体写进基线，推上去 CI 里每一张图都会失败
# ——包括不含任何改动的那几页（登录页没有侧栏，改导航时它不应该变，但它变了，
# 那就是字体差异的铁证）。
#
# 所以基线更新单独成一个手动工作流：在 CI 同一镜像里跑 update，由 bot 提交。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install root deps
        run: pnpm install --frozen-lockfile
      - name: Install admin deps
        working-directory: admin
        run: pnpm install --frozen-lockfile
      # 必须与 ci.yml 的 visual job 完全一致，否则生成的基线在 CI 上仍然对不上。
      - name: Install Chromium + CJK fonts
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Update snapshots
        run: pnpm test:visual:update
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/visual
          if git diff --cached --quiet; then
            echo "基线无变化，无需提交"
            exit 0
          fi
          git commit -m "test(visual): 在 CI 字体环境更新截图基线（本地字体与 CI 不同，基线只能由本工作流生成）"
          git push
