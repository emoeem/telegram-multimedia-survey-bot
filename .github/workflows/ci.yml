name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install root deps
        run: pnpm install --frozen-lockfile
      - name: Install admin deps
        working-directory: admin
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Admin build
        working-directory: admin
        run: pnpm build
      - name: PDF parser + URL importer regression
        run: |
          python3 -m venv /tmp/pdf-venv
          /tmp/pdf-venv/bin/pip install -q pymupdf
          /tmp/pdf-venv/bin/python scripts/test_forms_pdf_to_survey.py
          /tmp/pdf-venv/bin/python scripts/test_import_survey_from_url.py

  tg-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tg-archive (offline test deps)
        working-directory: tg-archive
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        working-directory: tg-archive
        run: python -m pytest -q

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install root deps
        run: pnpm install --frozen-lockfile
      - name: Install admin deps
        working-directory: admin
        run: pnpm install --frozen-lockfile
      - name: Install Chromium + CJK fonts
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Visual regression
        run: pnpm test:visual
