<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- 雨夜书房 · 夹着车票的旧书（ticket-book）。同套美术系统。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1628"/>
      <stop offset="1" stop-color="#130f1e"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e4a3f"/>
      <stop offset="1" stop-color="#1f3a30"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2e6cc"/>
      <stop offset="1" stop-color="#e0cda6"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecdcb8"/>
      <stop offset="1" stop-color="#d8c39a"/>
    </linearGradient>
    <radialGradient id="lampFall" cx="0.3" cy="0.1" r="0.95">
      <stop offset="0" stop-color="#f7dcae" stop-opacity="0.68"/>
      <stop offset="0.5" stop-color="#eebd82" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#eebd82" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.45" cy="0.45" r="0.85">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#050308" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="61" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.06 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- 背景虚化书脊 -->
  <g opacity="0.6" filter="url(#soft)">
    <rect x="20" y="60" width="60" height="400" fill="#3a2a1c"/>
    <rect x="90" y="90" width="50" height="370" fill="#2e3a2a"/>
    <rect x="150" y="70" width="66" height="390" fill="#5c2420"/>
    <rect x="226" y="100" width="46" height="360" fill="#31425a"/>
    <rect x="1000" y="70" width="60" height="390" fill="#3a2a1c"/>
    <rect x="1070" y="100" width="52" height="360" fill="#54401f"/>
  </g>

  <!-- 木面 -->
  <path d="M0 560 L1200 520 L1200 900 L0 900 Z" fill="#3a2a1c"/>
  <path d="M0 560 L1200 520 L1200 556 L0 600 Z" fill="#5f4732" opacity="0.5"/>
  <rect width="1200" height="900" fill="url(#lampFall)"/>

  <!-- 摊开的深绿布面旧书 -->
  <g>
    <ellipse cx="600" cy="812" rx="470" ry="50" fill="#000000" opacity="0.4" filter="url(#soft)"/>
    <!-- 封底（左，布面翘起） -->
    <path d="M150 700 C230 664, 330 656, 452 664 L470 800 C360 792, 250 798, 168 830 Z" fill="url(#cloth)"/>
    <path d="M150 700 C230 664, 330 656, 452 664 L456 676 C338 668, 240 676, 164 712 Z" fill="#3c5f4d"/>
    <g stroke="#16281f" stroke-width="2" opacity="0.5">
      <path d="M180 716 q120 -30 250 -30" fill="none"/><path d="M176 748 q130 -30 262 -30" fill="none"/><path d="M172 782 q140 -30 276 -28" fill="none"/>
    </g>
    <!-- 右页（翻开面） -->
    <path d="M452 664 C560 650, 700 648, 820 660 C900 668, 950 682, 962 700 L940 806 C830 788, 700 788, 470 800 Z" fill="url(#pageR)"/>
    <!-- 左页（翻起立在书脊上） -->
    <path d="M452 664 C470 640, 500 630, 540 636 L548 790 C510 784, 478 790, 470 800 Z" fill="url(#pageL)"/>
    <!-- 书页叠缘 -->
    <g fill="none" stroke="#c9b48c" stroke-width="2" opacity="0.6">
      <path d="M940 806 q8 4 16 3"/>
      <path d="M470 800 q-8 5 -14 12"/>
    </g>
    <!-- 书脊阴影 -->
    <path d="M452 664 L470 800 L548 790 L540 636 C500 630, 470 640, 452 664 Z" fill="#c9b48c" opacity="0.35"/>
  </g>

  <!-- 书页文字行（模糊墨线） -->
  <g stroke="#5a4a66" stroke-width="4" stroke-linecap="round" opacity="0.4" filter="url(#soft6)">
    <path d="M570 680 q110 -6 220 -2"/>
    <path d="M568 716 q115 -6 230 -2"/>
    <path d="M566 752 q110 -6 224 -2"/>
    <path d="M564 788 q100 -6 200 -2"/>
  </g>
  <!-- 水渍痕 -->
  <ellipse cx="700" cy="760" rx="70" ry="26" fill="#a8906a" opacity="0.3" filter="url(#soft6)"/>
  <ellipse cx="700" cy="760" rx="38" ry="14" fill="#96825e" opacity="0.3" filter="url(#soft6)"/>

  <!-- 旧式火车票（泛黄，票面模糊墨点） -->
  <g transform="rotate(-8 700 700)">
    <rect x="600" y="664" width="220" height="86" rx="6" fill="#e8d0a0"/>
    <rect x="600" y="664" width="220" height="86" rx="6" fill="none" stroke="#b89d6e" stroke-width="3"/>
    <line x1="680" y1="664" x2="680" y2="750" stroke="#b89d6e" stroke-width="2" stroke-dasharray="6 5"/>
    <g fill="#5a4a66" opacity="0.35">
      <ellipse cx="640" cy="690" rx="26" ry="9" filter="url(#soft6)"/>
      <ellipse cx="636" cy="716" rx="20" ry="7" filter="url(#soft6)"/>
      <ellipse cx="710" cy="688" rx="14" ry="6"/>
      <ellipse cx="712" cy="714" rx="10" ry="5"/>
      <ellipse cx="760" cy="700" rx="16" ry="7" filter="url(#soft6)"/>
    </g>
    <circle cx="800" cy="678" r="5" fill="#5a4a66" opacity="0.3"/>
    <circle cx="792" cy="730" r="4" fill="#5a4a66" opacity="0.25"/>
  </g>

  <!-- 压干的白色小花 -->
  <g transform="rotate(14 800 760)">
    <g fill="#f2ecdc">
      <ellipse cx="800" cy="742" rx="14" ry="22" transform="rotate(18 800 742)"/>
      <ellipse cx="800" cy="742" rx="14" ry="22" transform="rotate(80 800 742)"/>
      <ellipse cx="800" cy="742" rx="14" ry="22" transform="rotate(150 800 742)"/>
      <ellipse cx="800" cy="742" rx="14" ry="22" transform="rotate(215 800 742)"/>
      <ellipse cx="800" cy="742" rx="14" ry="22" transform="rotate(290 800 742)"/>
    </g>
    <circle cx="800" cy="742" r="8" fill="#d8b24a" opacity="0.85"/>
    <path d="M800 764 q-4 26 2 44" stroke="#7a8a5a" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.5" fill="transparent"/>
  <rect width="1200" height="900" fill="url(#vignette)"/>
</svg>
