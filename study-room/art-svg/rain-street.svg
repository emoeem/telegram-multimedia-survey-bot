<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- 雨夜书房 · 窗外的雨街（rain-street）。同套美术系统。 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="0.55" stop-color="#122340"/>
      <stop offset="1" stop-color="#1a3050"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a42"/>
      <stop offset="1" stop-color="#0e1626"/>
    </linearGradient>
    <radialGradient id="lampPool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98f" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#e8b878" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e8b878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shopGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffdf9f" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffdf9f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.45" cy="0.45" r="0.85">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#04060c" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="21" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.06 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <g id="rainLine">
      <line x1="0" y1="0" x2="-4" y2="34" stroke="#cfe0f2" stroke-opacity="0.4" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="12" y1="18" x2="9" y2="56" stroke="#cfe0f2" stroke-opacity="0.28" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="26" y1="4" x2="23" y2="44" stroke="#cfe0f2" stroke-opacity="0.34" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="40" y1="26" x2="37" y2="62" stroke="#cfe0f2" stroke-opacity="0.22" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="54" y1="10" x2="51" y2="48" stroke="#cfe0f2" stroke-opacity="0.3" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <pattern id="rain" width="140" height="96" patternUnits="userSpaceOnUse">
      <use href="#rainLine"/>
      <use href="#rainLine" x="66" y="44"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- 远处建筑剪影 -->
  <g fill="#0d1828">
    <rect x="0" y="240" width="200" height="330"/>
    <rect x="200" y="300" width="160" height="270"/>
    <rect x="820" y="260" width="180" height="310"/>
    <rect x="1000" y="220" width="200" height="350"/>
    <path d="M360 340 l60 -70 60 70 Z"/>
    <path d="M520 360 l50 -60 50 60 Z"/>
    <rect x="480" y="360" width="180" height="210"/>
  </g>
  <!-- 屋檐与暖橱窗 -->
  <g>
    <rect x="330" y="330" width="330" height="26" fill="#0a121e"/>
    <ellipse cx="480" cy="420" rx="150" ry="90" fill="url(#shopGlow)" filter="url(#soft)"/>
    <rect x="400" y="380" width="170" height="120" rx="4" fill="#ffdf9f" opacity="0.5" filter="url(#soft6)"/>
    <rect x="410" y="390" width="150" height="100" rx="3" fill="#ffe9bd" opacity="0.65"/>
    <line x1="486" y1="390" x2="486" y2="490" stroke="#1a140c" stroke-width="6"/>
    <line x1="410" y1="440" x2="560" y2="440" stroke="#1a140c" stroke-width="5"/>
  </g>

  <!-- 街面 -->
  <rect y="560" width="1200" height="340" fill="url(#street)"/>
  <!-- 石板路反光 -->
  <g stroke="#5f7fae" stroke-linecap="round" opacity="0.35">
    <path d="M120 640 q80 -6 170 -3" stroke-width="5" fill="none"/>
    <path d="M420 700 q110 -8 220 -4" stroke-width="7" fill="none" opacity="0.8"/>
    <path d="M300 790 q150 -10 300 -5" stroke-width="9" fill="none" opacity="0.6"/>
    <path d="M700 620 q90 -6 190 -3" stroke-width="4" fill="none"/>
    <path d="M880 760 q140 -10 280 -6" stroke-width="8" fill="none" opacity="0.5"/>
  </g>
  <g stroke="#e8b878" stroke-linecap="round" opacity="0.28">
    <path d="M520 660 q60 -4 120 -2" stroke-width="5" fill="none"/>
    <path d="M560 760 q90 -6 180 -3" stroke-width="7" fill="none" opacity="0.9"/>
    <path d="M480 840 q120 -8 240 -4" stroke-width="9" fill="none" opacity="0.7"/>
  </g>
  <!-- 石板缝 -->
  <g stroke="#0a111e" stroke-width="3" opacity="0.6">
    <path d="M0 640 q300 -12 600 -6 t600 -4" fill="none"/>
    <path d="M0 760 q300 -14 600 -8 t600 -6" fill="none"/>
    <path d="M0 866 q300 -12 600 -8 t600 -4" fill="none"/>
  </g>

  <!-- 维多利亚路灯 -->
  <g>
    <ellipse cx="600" cy="600" rx="260" ry="220" fill="url(#lampPool)" filter="url(#soft)"/>
    <rect x="588" y="300" width="10" height="290" fill="#0c0e14"/>
    <rect x="576" y="580" width="34" height="16" rx="4" fill="#0c0e14"/>
    <path d="M570 300 q30 -10 46 2 l-6 26 q-17 -8 -34 -2 Z" fill="#0c0e14"/>
    <ellipse cx="593" cy="296" rx="26" ry="14" fill="#ffd98f" filter="url(#soft6)"/>
    <ellipse cx="593" cy="296" rx="12" ry="7" fill="#fff2d0"/>
    <line x1="593" y1="303" x2="593" y2="588" stroke="#ffd98f" stroke-width="3" stroke-opacity="0.25"/>
  </g>

  <!-- 雨丝 -->
  <rect width="1200" height="900" fill="url(#rain)"/>
  <rect width="1200" height="560" fill="url(#rain)" opacity="0.7" transform="translate(30 -20)"/>

  <!-- 右下角：本侧窗框 -->
  <g>
    <path d="M1200 620 L1040 620 L1040 900 L1200 900 Z" fill="#241a12"/>
    <path d="M1064 640 L1200 640 L1200 876 L1064 876 Z" fill="#0a1424" opacity="0.75"/>
    <path d="M1075 655 C1070 720, 1082 800, 1074 862" stroke="#dfeaf6" stroke-opacity="0.4" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M1130 648 C1134 730, 1122 810, 1130 870" stroke="#dfeaf6" stroke-opacity="0.25" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="1040" y="608" width="160" height="16" fill="#4d3826"/>
  </g>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.5" fill="transparent"/>
  <rect width="1200" height="900" fill="url(#vignette)"/>
</svg>
