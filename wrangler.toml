name = "telegram-multimedia-survey-bot"
main = "src/index.ts"
assets = { directory = "admin/dist", binding = "ASSETS", run_worker_first = true, not_found_handling = "none", html_handling = "none" }
compatibility_date = "2026-08-14"
minify = true
workers_dev = true
preview_urls = false
# workers.dev is SNI-blocked in mainland China, so the same Worker is also
# served on this custom domain. workers_dev stays enabled on purpose: the
# Telegram webhook keeps pointing at it (ensureWebhookAllowsChannelPosts in
# src/index.ts only rewrites the webhook to the origin a request arrived on,
# and only Telegram ever calls /telegram/webhook), which keeps bot delivery
# independent of whatever this domain's DNS is doing.
routes = [
  { pattern = "emoe.eu.cc", custom_domain = true }
]

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = false


[vars]
ENVIRONMENT = "production"
APP_VERSION = "0.3.0"
LICENSE_ENFORCEMENT = "disabled"
LICENSE_GRACE_SECONDS = "86400"
# The vendor's authorization center: it may issue licenses, publish releases and
# hand out trial accounts. Customer deployments are generated with
# DEPLOYMENT_ROLE = "customer" (scripts/deploy-customer.mjs) and are refused
# those surfaces even if they hold a stray admin token.
DEPLOYMENT_ROLE = "vendor"
# Cloudflare Stream（视频答卷）**已停用**。
#
# 停用的理由是计费模型而不是功能：Stream 是本部署里唯一按「分钟」线性计费的
# 资源（Basic：$5 / 1000 分钟，超出 $0.005/分钟），一张直传凭证最长可换 15 分钟。
# 其余按量资源要么有免费额度（R2 10GB），要么单价与体量无关（Worker 请求）。
#
# 这是**硬开关**：`true` 时 streamConfigured() 无条件返回 false，即使
# STREAM_ACCOUNT_ID / STREAM_API_TOKEN 两个 secret 都存在，`POST
# /api/survey/:id/media/stream-ticket` 也只会回 404 stream_unavailable，
# 能力面板的 streamVideo 同样报 false（见 src/services/plan.service.ts）。
#
# 要重新启用：把这一行改成 "false"（并确认 Stream 订阅仍在）。
# 用显式变量而不是「删掉 secret」来停用，是为了让停用状态留在 diff 里——
# 删 secret 是隐式的，下次有人补回 token 时视频通道会无声重开。
STREAM_DISABLED = "true"
REPORT_CHANNEL_ID = "-1004489719605"
# 认证卡生成器「完成制作」时，把用户原图与成品图同步到的频道。
# 解析顺序（先命中先用），见 src/http/cert-share.ts#resolveCertShareChannel：
#   1. 系统设置 cert_share_channel_id（控制中心「认证卡作品频道」卡片可改）
#   2. 环境变量 CERT_SHARE_CHANNEL（本行）
#   3. 报告归档频道（REPORT_CHANNEL_ID → KV 缓存 → 系统设置 report_channel_id）
# 留空 = 继承报告归档频道，也就是下面这个 -1004489719605。要指向别的频道，
# 建议在控制中心改（落库、立即生效、无需重新部署），而不是改本行。
# 客户部署（DEPLOYMENT_ROLE = "customer"）不生成这两个变量，因此该功能默认关闭。
CERT_SHARE_CHANNEL = ""
# 置 "true" 可无条件停用认证卡同步，优先级高于以上全部。
# 当前为 "false"：女生导出认证卡后默认同步一份到上面的频道（前端勾选框默认勾选，
# 用户可以自己取消）。客户部署（DEPLOYMENT_ROLE = "customer"）不生成该变量，
# 走 isDisabled() 的缺省判断，行为不受这里影响。
CERT_SHARE_DISABLED = "false"
COMMUNITY_GROUP_URL = "https://t.me/+qf4zUA8SvNEwNWFh"
# Survey access-code pepper is a Cloudflare Secret; do not define it in [vars].
# 投稿入口：投稿中心（/submissions 的三个页签之一 —— 免登录投稿）。
# 合并后 /submit 仍然可用，但它只是 302 到 /submissions?tab=anon，直接把入口
# 指到最终地址可以少一跳，也让文案里的域名永远落在同一个页面上。
# 由 cn-relay 反代到本站；国内可直接打开。
# 想改回 Telegram 机器人就把值换成 https://t.me/tougaojiqirbot。
SUBMISSION_BOT_URL = "https://emoemok.top/submissions?tab=anon"
# 免登录投稿的后端是一个独立部署的 Worker（/api/submit/*：表单定义、收件箱、
# 回复）。不配这一项，那些接口只在中继域名 emoemok.top 上存在（cn-relay 的
# vercel.json 里有专门的两条 routes），本域上会静默回落成 SPA 的 index.html。
# 投稿中心的「免登录投稿」页签依赖它，必须配。
SUBMISSION_BOT_API_ORIGIN = "https://submission-bot.3353745917.workers.dev"
# 网页投稿审核的共享密钥，**必须和投稿机器人 Worker 上的 REVIEW_API_SECRET 完全
# 相同**。浏览器永远拿不到它：后台先验证管理员会话，再由本站 Worker 带上
# `x-review-secret` 转发给 /api/admin/review/*（见 src/http/admin/web-submission.ts）。
#
# 没配 = 后台的「网页投稿」页面明确报 503，而不是退化成"无鉴权也能转发"。要配就
# 两边一起配，只配一边的表现是 401/503（对方的密钥为空或对不上）。
#
# 用 secret 存，不要写进这个文件：
#   npx wrangler secret put WEB_REVIEW_SECRET    # 本站（管理员账号 ed1957…）
#   # 投稿机器人那边（另一个 Cloudflare 账号 fb8f4c…）：
#   #   REVIEW_API_SECRET 必须填同一个值，见 /home/emo/code/bot/README.md
# Canonical origin for user-facing links (Telegram buttons, admin login deep
# link, og: metadata). The webhook deliberately keeps arriving on the
# workers.dev hostname, so without this pin the bot would keep handing users
# the SNI-blocked hostname instead of the custom domain. Points at the
# mainland relay domain so those links resolve for domestic users too; see
# docs/CN_ACCESS_VERCEL_RELAY.md.
PUBLIC_ORIGIN = "https://emoemok.top"
# RELAY_SECRET is a Cloudflare Secret (`wrangler secret put RELAY_SECRET`), not
# a [vars] entry: it is the shared secret the China relay proves itself with,
# and anyone holding it can forge the visitor address. Unset = requests are
# judged by their peer address, i.e. the pre-relay behaviour.
# See docs/CN_ACCESS_VERCEL_RELAY.md.

# Browser renders for queue jobs run in a request context via the SELF
# service binding (queue-context sessions die on constrained accounts).
# Worker configs without the binding fall back to in-process rendering.
[[services]]
binding = "SELF"
service = "telegram-multimedia-survey-bot"

[[d1_databases]]
binding = "DB"
database_name = "telegram-survey-db"
database_id = "159e8169-a233-4bd7-b3e9-723586f850c2"
migrations_dir = "db/migrations"

# R2 媒体桶（Pro 能力，docs/CLOUDFLARE_PLAN_TIERS.md）：答卷附件/题目媒体大文件
# 存 R2（survey-media 桶），TieredMediaStore 读取回落 KV（旧数据仍可读）。
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "survey-media"

[[kv_namespaces]]
binding = "MEDIA_KV"
id = "1761c29892764597992c189096bc62c2"
preview_id = "1761c29892764597992c189096bc62c2"

[[kv_namespaces]]
binding = "CACHE"
id = "0e659a11ec914cfa9d4922e45ab40ec4"
preview_id = "0e659a11ec914cfa9d4922e45ab40ec4"

[[queues.producers]]
binding = "EXPORT_QUEUE"
queue = "telegram-survey-export"

[[queues.consumers]]
queue = "telegram-survey-export"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 3

[browser]
binding = "BROWSER"

[triggers]
# The retry/recovery driver used to run every 10 minutes, which spent three
# times the rows read it needed to. 30 minutes is the trade: worst case report
# delivery waits half an hour instead of ten minutes.
crons = ["*/30 * * * *", "15 1 * * *", "30 9 * * 1"]

# Workers Logs：`request_metrics` / `queue_metrics` / `Resend email failed`
# 这些 console 输出此前只能在 `wrangler tail` 里实时看到，会话一断就没了，
# 于是「额度什么时候打满的」「验证码为什么发不出去」都只能靠复现。
# 超过免费额度（20 万事件/天、保留 3 天）只是停止记录，不影响请求处理。
[observability]
enabled = true

[observability.logs]
invocation_logs = true

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SurveySessionDO"

[[durable_objects.bindings]]
name = "BUILDER"
class_name = "SurveyBuilderDO"

[[durable_objects.bindings]]
name = "UI"
class_name = "UiSessionDO"

[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SurveySessionDO", "SurveyBuilderDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UiSessionDO"]

# Atomic rate limiting. KV allows one write per key per second, so the previous
# get-then-put counter lost increments whenever two requests arrived together;
# a Durable Object serialises them instead.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateLimitDO"]
