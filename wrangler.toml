name = "telegram-multimedia-survey-bot"
main = "src/index.ts"
assets = { directory = "admin/dist", binding = "ASSETS", run_worker_first = true, not_found_handling = "none", html_handling = "none" }
compatibility_date = "2026-08-14"
minify = true
workers_dev = true
preview_urls = false
# workers.dev is SNI-blocked in mainland China, so the same Worker is also
# served on this custom domain. workers_dev stays enabled on purpose: the
# Telegram webhook keeps pointing at it (ensureWebhookAllowsChannelPosts in
# src/index.ts only rewrites the webhook to the origin a request arrived on,
# and only Telegram ever calls /telegram/webhook), which keeps bot delivery
# independent of whatever this domain's DNS is doing.
routes = [
  { pattern = "emoe.eu.cc", custom_domain = true }
]

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = false


[vars]
ENVIRONMENT = "production"
APP_VERSION = "0.3.0"
LICENSE_ENFORCEMENT = "disabled"
LICENSE_GRACE_SECONDS = "86400"
# The vendor's authorization center: it may issue licenses, publish releases and
# hand out trial accounts. Customer deployments are generated with
# DEPLOYMENT_ROLE = "customer" (scripts/deploy-customer.mjs) and are refused
# those surfaces even if they hold a stray admin token.
DEPLOYMENT_ROLE = "vendor"
REPORT_CHANNEL_ID = "-1004489719605"
COMMUNITY_GROUP_URL = "https://t.me/+qf4zUA8SvNEwNWFh"
# Survey access-code pepper is a Cloudflare Secret; do not define it in [vars].
# 投稿入口：指向投稿机器人的网页表单（不用 Telegram 也能投），
# 由 cn-relay 反代到 submission-bot Worker 的 /submit；国内可直接打开。
# 想改回 Telegram 机器人就把值换成 https://t.me/tougaojiqirbot。
SUBMISSION_BOT_URL = "https://emoemok.top/submit"
# Canonical origin for user-facing links (Telegram buttons, admin login deep
# link, og: metadata). The webhook deliberately keeps arriving on the
# workers.dev hostname, so without this pin the bot would keep handing users
# the SNI-blocked hostname instead of the custom domain. Points at the
# mainland relay domain so those links resolve for domestic users too; see
# docs/CN_ACCESS_VERCEL_RELAY.md.
PUBLIC_ORIGIN = "https://emoemok.top"
# RELAY_SECRET is a Cloudflare Secret (`wrangler secret put RELAY_SECRET`), not
# a [vars] entry: it is the shared secret the China relay proves itself with,
# and anyone holding it can forge the visitor address. Unset = requests are
# judged by their peer address, i.e. the pre-relay behaviour.
# See docs/CN_ACCESS_VERCEL_RELAY.md.

# Browser renders for queue jobs run in a request context via the SELF
# service binding (queue-context sessions die on constrained accounts).
# Worker configs without the binding fall back to in-process rendering.
[[services]]
binding = "SELF"
service = "telegram-multimedia-survey-bot"

[[d1_databases]]
binding = "DB"
database_name = "telegram-survey-db"
database_id = "159e8169-a233-4bd7-b3e9-723586f850c2"
migrations_dir = "db/migrations"

[[kv_namespaces]]
binding = "MEDIA_KV"
id = "1761c29892764597992c189096bc62c2"
preview_id = "1761c29892764597992c189096bc62c2"

[[kv_namespaces]]
binding = "CACHE"
id = "0e659a11ec914cfa9d4922e45ab40ec4"
preview_id = "0e659a11ec914cfa9d4922e45ab40ec4"

[[queues.producers]]
binding = "EXPORT_QUEUE"
queue = "telegram-survey-export"

[[queues.consumers]]
queue = "telegram-survey-export"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 3

[browser]
binding = "BROWSER"

[triggers]
# The retry/recovery driver used to run every 10 minutes, which spent three
# times the rows read it needed to. 30 minutes is the trade: worst case report
# delivery waits half an hour instead of ten minutes.
crons = ["*/30 * * * *", "15 1 * * *", "30 9 * * 1"]

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SurveySessionDO"

[[durable_objects.bindings]]
name = "BUILDER"
class_name = "SurveyBuilderDO"

[[durable_objects.bindings]]
name = "UI"
class_name = "UiSessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SurveySessionDO", "SurveyBuilderDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UiSessionDO"]
